<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa domov – GTA 5</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --sea:#12406b; --panel:#1c2a31; --panel-2:#26373f;
    --text:#e8eef0; --muted:#9fb1b8; --pin:#f2b134;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:'Barlow',system-ui,sans-serif;background:var(--panel);color:var(--text)}
  .app{display:grid;grid-template-columns:1fr 380px;height:100vh;height:100dvh}
  #map{background:var(--sea);outline:none;cursor:default}
  aside{background:var(--panel);overflow-y:auto;padding:24px}
  h1,h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;margin:0 0 10px;line-height:1.05}
  h1{font-size:34px} h2{font-size:30px}
  .muted{color:var(--muted);margin:0 0 18px}
  .list{list-style:none;margin:0;padding:0}
  .list button,.back{font:inherit;color:var(--text);cursor:pointer;border:0}
  .list button{width:100%;text-align:left;padding:12px 14px;margin-bottom:6px;background:var(--panel-2);border-radius:6px;border-left:4px solid transparent}
  .list button:hover{border-left-color:var(--pin)}
  .back{background:none;color:var(--pin);padding:0;margin-bottom:14px;font-weight:500}
  button:focus-visible{outline:2px solid var(--pin);outline-offset:2px}
  .main-photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:var(--panel-2);display:block}
  .empty-photo{aspect-ratio:4/3;border-radius:6px;background:var(--panel-2);display:grid;place-items:center;color:var(--muted)}
  .thumbs{display:flex;gap:6px;margin:8px 0 16px;flex-wrap:wrap}
  .thumbs button{padding:0;border:2px solid transparent;border-radius:4px;background:none;cursor:pointer;overflow:hidden}
  .thumbs button.on{border-color:var(--pin)}
  .thumbs img{width:64px;height:48px;object-fit:cover;display:block}
  dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0 0 16px}
  dt{color:var(--muted)} dd{margin:0}
  .desc{line-height:1.55;margin:0;max-width:60ch}

  .pin span{display:block;width:26px;height:26px;background:var(--pin);border:3px solid var(--panel);
    border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .15s,background .15s}
  .pin.active span{background:#fff;transform:rotate(-45deg) scale(1.3)}
  .leaflet-marker-icon{cursor:pointer}
  .coords{position:absolute;left:12px;bottom:12px;z-index:500;background:var(--panel);color:var(--text);
    padding:6px 10px;border-radius:6px;font-size:14px;display:none}
  .leaflet-tooltip{font-family:'Barlow',sans-serif;font-weight:500}

  @media (max-width:800px){
    .app{grid-template-columns:1fr;grid-template-rows:55vh 1fr;grid-template-rows:55dvh 1fr}
  }
</style>
</head>
<body>
<div class="app">
  <div id="map" role="application" aria-label="Mapa GTA 5"></div>
  <aside id="panel" aria-live="polite"></aside>
</div>
<div class="coords" id="coords"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Názov obrázka mapy. Rozmery sa zistia automaticky, nemusíš ich nikde zadávať.
  const IMG = 'mapa.jpg';

  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let MAP_W, MAP_H, map, houses = [], markers = {}, currentId = null;
  const toLatLng = h => [MAP_H - h.y, h.x];   // y počítame zhora ako v obrázku

  function setActive(id) {
    Object.entries(markers).forEach(([k, m]) => {
      const el = m.getElement();
      if (el) el.classList.toggle('active', k === id);
    });
  }

  function showList() {
    currentId = null;
    setActive(null);
    history.replaceState(null, '', location.pathname);
    $('#panel').innerHTML =
      `<h1>Domy</h1><p class="muted">Klikni na pin v mape alebo vyber dom zo zoznamu.</p>` +
      `<ul class="list">${houses.map(h => `<li><button data-id="${esc(h.id)}">${esc(h.name)}</button></li>`).join('')}</ul>`;
    $('#panel').scrollTop = 0;
  }

  function showHouse(id) {
    const h = houses.find(x => x.id === id);
    if (!h) return showList();
    currentId = id;
    setActive(id);
    history.replaceState(null, '', '#' + id);

    const photos = h.photos || [];
    const gallery = photos.length
      ? `<img class="main-photo" id="main-photo" src="${esc(photos[0])}" alt="${esc(h.name)}">
         <div class="thumbs">${photos.map((p, i) =>
           `<button data-photo="${i}" class="${i === 0 ? 'on' : ''}" aria-label="Fotka ${i + 1}"><img src="${esc(p)}" alt=""></button>`).join('')}</div>`
      : `<div class="empty-photo">Zatiaľ bez fotiek</div><div class="thumbs"></div>`;

    const details = h.details
      ? `<dl>${Object.entries(h.details).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : '';

    $('#panel').innerHTML =
      `<button class="back" data-back>← Všetky domy</button>
       <h2>${esc(h.name)}</h2>${gallery}${details}<p class="desc">${esc(h.desc || '')}</p>`;
    $('#panel').scrollTop = 0;
  }

  // Kliky v bočnom paneli
  $('#panel').addEventListener('click', e => {
    const item = e.target.closest('[data-id]');
    const thumb = e.target.closest('[data-photo]');
    if (item) showHouse(item.dataset.id);
    else if (e.target.closest('[data-back]')) showList();
    else if (thumb) {
      const h = houses.find(x => x.id === currentId);
      $('#main-photo').src = h.photos[thumb.dataset.photo];
      document.querySelectorAll('.thumbs button').forEach(b => b.classList.toggle('on', b === thumb));
    }
  });

  document.addEventListener('keydown', e => { if (e.key === 'Escape' && map) showList(); });

  function start() {
    // Pevná mapa: nedá sa posúvať ani približovať
    map = L.map('map', {
      crs: L.CRS.Simple, minZoom: -6, maxZoom: 2, zoomSnap: 0, attributionControl: false,
      zoomControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
      touchZoom: false, boxZoom: false, keyboard: false
    });
    const bounds = [[0, 0], [MAP_H, MAP_W]];
    L.imageOverlay(IMG, bounds).addTo(map);

    // Celá mapa sa vždy zmestí do okna (aj po zmene veľkosti okna)
    const fit = () => map.fitBounds(bounds, {animate: false});
    fit();
    map.on('resize', fit);

    // Pomocník na zisťovanie súradníc pre nové domy: klikni do mapy
    map.on('click', e => {
      const x = Math.round(e.latlng.lng), y = Math.round(MAP_H - e.latlng.lat);
      const box = $('#coords');
      box.textContent = `x: ${x}, y: ${y}`;
      box.style.display = 'block';
      console.log(`"x": ${x}, "y": ${y}`);
    });

    fetch('data.json')
      .then(r => r.json())
      .then(data => {
        houses = data;
        houses.forEach(h => {
          markers[h.id] = L.marker(toLatLng(h), {icon: L.divIcon({className: 'pin', html: '<span></span>', iconSize: [26, 26], iconAnchor: [13, 26]}), title: h.name})
            .addTo(map)
            .bindTooltip(h.name, {direction: 'top', offset: [0, -26]})   // pri nabehnutí myšou
            .on('click', () => showHouse(h.id));                          // po kliknutí sa otvorí detail
        });
        location.hash ? showHouse(location.hash.slice(1)) : showList();
      })
      .catch(() => {
        $('#panel').innerHTML = '<h1>Dáta sa nenačítali</h1><p class="muted">Skontroluj súbor data.json.</p>';
      });
  }

  // Najprv sa načíta obrázok, zistia sa jeho rozmery a až potom sa spustí mapa
  const probe = new Image();
  probe.onload = () => {
    MAP_W = probe.naturalWidth; MAP_H = probe.naturalHeight;
    // Okolie mapy (ak sa nezmestí presne do okna) sa zafarbí farbou z rohu obrázka
    try {
      const c = document.createElement('canvas'); c.width = c.height = 8;
      const ctx = c.getContext('2d'); ctx.drawImage(probe, 0, 0, 8, 8);
      const [r, g, b] = ctx.getImageData(0, 0, 1, 1).data;
      $('#map').style.background = `rgb(${r},${g},${b})`;
    } catch (e) {}
    start();
  };
  probe.onerror = () => { $('#map').textContent = 'Obrázok ' + IMG + ' sa nenašiel.'; };
  probe.src = IMG;
</script>
</body>
</html>
